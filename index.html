<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Muscle Legends Online — prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#11151d;color:#f4f6fa;font:16px system-ui;overflow:hidden}
#world{position:fixed;inset:0;width:100%;height:100%;display:block;background:linear-gradient(#242d3c,#10151e)}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{pointer-events:auto;background:rgba(20,27,38,.94);border:1px solid rgba(255,255,255,.12);border-radius:16px;box-shadow:0 16px 50px #0008;backdrop-filter:blur(10px)}
#mainMenu{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-start;padding:clamp(18px,5vw,64px);background:linear-gradient(90deg,rgba(7,10,16,.88),rgba(7,10,16,.35) 55%,rgba(7,10,16,.05))}
.menuCard{width:min(420px,100%);padding:28px}
.logo{font-size:clamp(30px,5vw,48px);font-weight:950;line-height:.95;letter-spacing:-1.8px}
.logo span{color:#9c83ff}.subtitle{color:#aab4c3;margin:12px 0 24px}
button,input{width:100%;padding:13px 14px;margin:7px 0;border:0;border-radius:10px;font:inherit}
button{background:#7657f5;color:white;font-weight:800;cursor:pointer;transition:transform .15s,filter .15s}
button:hover{filter:brightness(1.12);transform:translateY(-1px)}
button.secondary{background:#303b4c;color:#e9edf5}
button:disabled{opacity:.55;cursor:not-allowed;transform:none}
input{background:#303b4c;color:white;outline:1px solid #ffffff12}
#connection{font-size:13px;color:#ffc978;min-height:20px;margin-top:8px}
#gameHud{position:absolute;inset:0;display:none;padding:18px;justify-content:space-between;align-items:flex-start}
.stats{padding:14px 18px;min-width:190px}.stats b{font-size:22px}
#hudButtons{display:flex;gap:8px;pointer-events:auto}
#hudButtons button{width:auto;margin:0;padding:10px 14px}
#trainPanel{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:10px;pointer-events:auto}
#trainPanel button{width:auto;min-width:130px;margin:0}
#settingsPanel{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(360px,calc(100% - 32px));padding:22px}
#settingsPanel h2{margin-top:0}
#online{font-size:12px;color:#b7c1d1;margin-top:8px}
@media(max-width:600px){#mainMenu{align-items:flex-end;padding:14px;background:linear-gradient(0deg,rgba(7,10,16,.96),rgba(7,10,16,.35))}.menuCard{padding:20px}.logo{font-size:34px}#gameHud{padding:10px}.stats{min-width:0;padding:10px 12px}.stats b{font-size:18px}#hudButtons{flex-direction:column}#hudButtons button{padding:8px 10px}#trainPanel{bottom:12px;width:calc(100% - 24px)}#trainPanel button{min-width:0;flex:1;padding:11px 6px;font-size:13px}}
</style></head><body>
<canvas id="world"></canvas>
<div id="hud">
  <section id="mainMenu">
    <div class="menuCard panel">
      <div class="logo">MUSCLE<br><span>LEGENDS</span></div>
      <div class="subtitle">ONLINE • TRAIN • GROW STRONGER</div>
      <input id="playerName" maxlength="18" value="Player" placeholder="Имя игрока">
      <input id="serverAddress" value="ws://localhost:8080" aria-label="Адрес сервера">
      <button id="playButton">ИГРАТЬ</button>
      <button class="secondary" id="openSettings">НАСТРОЙКИ</button>
      <div id="connection">Не подключено к серверу</div>
    </div>
  </section>

  <section id="gameHud">
    <div class="stats panel">
      <div>СИЛА: <b id="strength">0</b></div>
      <div>МОНЕТЫ: <b id="coins">0</b></div>
      <div>REBIRTH: <b id="rebirths">0</b></div>
      <div id="online">Игроков онлайн: 0</div>
    </div>
    <div id="hudButtons">
      <button class="secondary" id="backToMenu">МЕНЮ</button>
    </div>
    <div id="trainPanel" class="panel">
      <button id="train">ТРЕНИРОВКА +1</button>
      <button class="secondary" id="sell">ПРОДАТЬ СИЛУ</button>
      <button class="secondary" id="rebirth">REBIRTH</button>
    </div>
  </section>

  <section id="settingsPanel" class="panel">
    <h2>Настройки</h2>
    <label for="serverSetting">Адрес WebSocket-сервера</label>
    <input id="serverSetting" value="ws://localhost:8080">
    <button id="saveSettings">СОХРАНИТЬ</button>
    <button class="secondary" id="closeSettings">НАЗАД</button>
  </section>
</div>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";

const canvas=document.querySelector("#world");
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x202938);
const camera=new THREE.PerspectiveCamera(42,1,.1,100);
camera.position.set(3.8,2.8,5.8); camera.lookAt(0,1.4,0);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
scene.add(new THREE.HemisphereLight(0xffffff,0x596070,2));
const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(3,5,4);scene.add(light);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:0x354052}));
floor.rotation.x=-Math.PI/2;floor.position.y=-.02;scene.add(floor);
const grid=new THREE.GridHelper(30,30,0x69758b,0x3b4658);grid.position.y=.002;scene.add(grid);
const loader=new GLTFLoader();
loader.load("./assets/player-base.glb",g=>{scene.add(g.scene);},undefined,e=>console.error("GLB load failed",e));
function resize(){const r=canvas.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(canvas);resize();
function loop(){requestAnimationFrame(loop);renderer.render(scene,camera);}loop();

let ws=null,stats={strength:0,coins:0,rebirths:0},players={};
const $=s=>document.querySelector(s);
function setStatus(t,isError=false){$("#connection").textContent=t;$("#connection").style.color=isError?"#ff9292":"#9ee6a0";}
function render(){
  $("#strength").textContent=stats.strength??0;
  $("#coins").textContent=stats.coins??0;
  $("#rebirths").textContent=stats.rebirths??0;
  $("#online").textContent="Игроков онлайн: "+Object.keys(players).length;
}
function showMenu(){ $("#mainMenu").style.display="flex";$("#gameHud").style.display="none"; }
function showGame(){ $("#mainMenu").style.display="none";$("#gameHud").style.display="block"; }
function send(type){if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type}));}
function connect(){
  if(ws)ws.close();
  const address=$("#serverAddress").value.trim();
  setStatus("Подключаемся...");
  try{ws=new WebSocket(address);}catch(e){setStatus("Неверный адрес сервера",true);return;}
  ws.onopen=()=>{
    let pid=localStorage.getItem("ml-player-id");
    if(!pid){pid="p_"+crypto.randomUUID();localStorage.setItem("ml-player-id",pid);}
    ws.send(JSON.stringify({type:"join",playerId:pid,name:$("#playerName").value}));
  };
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.type==="joined"){
      stats=m.player;players=Object.fromEntries(m.players.map(p=>[p.id,p]));
      setStatus("Подключено к серверу");showGame();render();
    }else if(m.type==="stats"){stats=m.player;render();}
    else if(m.type==="worldState"){players=Object.fromEntries(m.players.map(p=>[p.id,p]));render();}
    else if(["playerJoined","playerUpdated","playerMoved"].includes(m.type)){players[m.player.id]=m.player;render();}
    else if(m.type==="playerLeft"){delete players[m.id];render();}
    else if(m.type==="error"){setStatus(m.message,true);}
  };
  ws.onerror=()=>setStatus("Не удалось подключиться. Проверь сервер.",true);
  ws.onclose=()=>{if($("#gameHud").style.display!=="none"){showMenu();}setStatus("Соединение закрыто",true);};
}
$("#playButton").onclick=connect;
$("#train").onclick=()=>send("train");
$("#sell").onclick=()=>send("sell");
$("#rebirth").onclick=()=>send("rebirth");
$("#backToMenu").onclick=()=>{showMenu();};
$("#openSettings").onclick=()=>{$("#serverSetting").value=$("#serverAddress").value;$("#settingsPanel").style.display="block";};
$("#closeSettings").onclick=()=>$("#settingsPanel").style.display="none";
$("#saveSettings").onclick=()=>{$("#serverAddress").value=$("#serverSetting").value;$("#settingsPanel").style.display="none";};
</script></body></html>
